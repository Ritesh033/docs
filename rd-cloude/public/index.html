<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RD Cloude</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="auth" hidden>
  <form id="authForm">
    <h1>RD Cloude</h1>
    <p class="muted">AI assistant, cloud infrastructure and drive in one place.</p>
    <input name="email" type="email" placeholder="Email" autocomplete="username" required>
    <input name="password" type="password" placeholder="Password (8+ chars)" autocomplete="current-password" required minlength="8">
    <input name="code" id="codeField" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code or recovery code" hidden>
    <button type="submit" data-mode="login">Sign in</button>
    <button type="button" id="toggleMode" class="link">Create an account</button>
    <a class="link" href="/auth/account#mode=forgot">Forgot password?</a>
    <p id="authErr" class="err"></p>
  </form>
</div>
<div id="app" hidden>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
